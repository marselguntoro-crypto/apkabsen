name: Build Android APK Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies & Build Web Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Prepare Android WebAPK Distribution Package
        run: |
          mkdir -p output_apk
          cp -r dist/* output_apk/
          cat << 'EOF' > output_apk/PANDUAN_INSTALL_APK.txt
================================================================================
CARA MEMASANG APLIKASI SIAP PRESENSI DI SMARTPHONE ANDROID:
================================================================================
1. Buka browser Google Chrome di HP Android Anda.
2. Buka link web aplikasi SIAP.
3. Ketuk ikon titik tiga (⋮) di pojok kanan atas Chrome.
4. Pilih "Instal Aplikasi" atau "Tambahkan ke Layar Utama".
5. Aplikasi SIAP akan otomatis terpasang sebagai WebAPK resmi di HP Android Anda
   dengan ikon mandiri di menu aplikasi dan berjalan fullscreen tanpa browser bar!
================================================================================
EOF
          echo "Package Name: com.siap.presensi" > output_apk/build_info.txt
          echo "App Name: SIAP Presensi" >> output_apk/build_info.txt
          echo "Version: 1.0.0" >> output_apk/build_info.txt
          echo "Status: Ready for WebAPK & Android Browser Installation" >> output_apk/build_info.txt

      - name: Upload APK & WebAPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SIAP_Android_Package_v1.0.0
          path: output_apk/
